name: notes_app
description: A founder's execution system — notes, tasks, projects, and daily dashboard.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  intl: ^0.18.1
  uuid: ^4.2.1
  shared_preferences: ^2.2.3
  flutter_markdown: ^0.7.3
  file_picker: ^8.0.5
  equatable: ^2.0.5
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  fonts:
    # IBM Plex, the same pair the web app self-hosts. It was drawn for
    # interfaces and instrumentation, and the mono is a true sibling of the
    # sans rather than a bolt-on — which is what lets every number and every
    # micro-label be mono without the screen looking like two typefaces
    # arguing. The code previously asked for 'Inter', which was never bundled,
    # so every screen silently fell back to the platform font.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
