name: notes_app
description: A founder's execution system — notes, tasks, projects, and daily dashboard.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  intl: ^0.18.1
  uuid: ^4.2.1
  shared_preferences: ^2.2.3
  flutter_slidable: ^3.1.1
  flutter_markdown: ^0.7.3
  file_picker: ^8.0.5
  equatable: ^2.0.5
  image_picker: ^1.1.2
  speech_to_text: ^6.6.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
